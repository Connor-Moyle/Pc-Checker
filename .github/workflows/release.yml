name: Release

# Tag a commit as vX.Y.Z (or vX.Y.Z-beta.N for the Beta channel) and push the
# tag. This workflow builds and tests the app, packages it with Velopack,
# zips a portable build, computes checksums and publishes everything to
# GitHub Releases. The in-app updater reads the same release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (for example 0.2.0 or 0.2.0-beta.1). A tag v<version> must exist."
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  REPO_URL: https://github.com/${{ github.repository }}

jobs:
  release:
    name: Build, package and publish
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}' }
          $v = $v.TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "'$v' is not a valid semantic version." }
          $pre = $v.Contains('-')
          "version=$v" >> $env:GITHUB_OUTPUT
          "prerelease=$($pre.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
          # Optional codename: the subject line of an annotated tag (git tag -a v1.2.3 -m "Codename").
          git fetch --force --tags origin 2>$null
          $codename = ''
          if ((git cat-file -t "v$v" 2>$null) -eq 'tag') { $codename = (git tag -l --format='%(contents:subject)' "v$v").Trim() }
          $title = if ($codename) { "PC Checker $v `"$codename`"" } else { "PC Checker $v" }
          "title=$title" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing $title (prerelease: $pre)"

      - name: Restore
        run: dotnet restore PcChecker.sln

      - name: Build
        run: dotnet build PcChecker.sln -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test PcChecker.sln -c Release --no-build

      - name: Publish self-contained win-x64
        run: >
          dotnet publish src/PcChecker.App/PcChecker.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Download previous releases (for delta updates)
        continue-on-error: true
        run: vpk download github --repoUrl ${{ env.REPO_URL }} --token ${{ secrets.GITHUB_TOKEN }} --outputDir Releases

      - name: Package with Velopack
        run: >
          vpk pack
          --packId PcChecker
          --packVersion ${{ steps.version.outputs.version }}
          --packDir publish
          --mainExe PcChecker.exe
          --packTitle "PC Checker"
          --packAuthors "PC Checker contributors"
          --icon src/PcChecker.App/Assets/icon.ico
          --outputDir Releases

      - name: Zip the portable build
        shell: pwsh
        run: |
          $zip = "PcChecker-${{ steps.version.outputs.version }}-portable-win-x64.zip"
          Compress-Archive -Path publish\* -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created $zip"

      - name: Compute SHA256SUMS.txt
        shell: pwsh
        run: |
          $files = @(Get-ChildItem Releases -File) + @(Get-Item "PcChecker-${{ steps.version.outputs.version }}-portable-win-x64.zip")
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          Set-Content -Path SHA256SUMS.txt -Value ($lines -join "`n") -NoNewline
          Get-Content SHA256SUMS.txt

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.title }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            Releases/*
            PcChecker-${{ steps.version.outputs.version }}-portable-win-x64.zip
            SHA256SUMS.txt
