name: Release

# Tag a commit as vX.Y.Z (or vX.Y.Z-beta.N for the Beta channel) and push the tag.
# This workflow builds the app, packages it with Velopack, and publishes the
# installer, update packages and a portable exe to GitHub Releases.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (for example 0.2.0 or 0.2.0-beta.1)"
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  REPO_URL: https://github.com/${{ github.repository }}

jobs:
  release:
    name: Build, package and publish
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}' }
          $v = $v.TrimStart('v')
          $pre = $v -match '-'
          "version=$v" >> $env:GITHUB_OUTPUT
          "prerelease=$($pre.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing $v (prerelease: $pre)"

      - name: Restore
        run: dotnet restore PcChecker.sln

      - name: Build and test
        run: |
          dotnet build PcChecker.sln -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}
          dotnet test PcChecker.sln -c Release --no-build

      - name: Publish self-contained build for the installer
        run: >
          dotnet publish src/PcChecker.App/PcChecker.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -o artifacts/publish

      - name: Publish portable single-file exe
        run: >
          dotnet publish src/PcChecker.App/PcChecker.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}
          -o artifacts/portable

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Download previous releases (for delta updates)
        continue-on-error: true
        run: vpk download github --repoUrl ${{ env.REPO_URL }} --token ${{ secrets.GITHUB_TOKEN }} --channel win

      - name: Package with Velopack
        run: >
          vpk pack
          --packId PcChecker
          --packTitle "PC Checker"
          --packAuthors "PC Checker contributors"
          --packVersion ${{ steps.version.outputs.version }}
          --packDir artifacts/publish
          --mainExe PcChecker.exe
          --icon src/PcChecker.App/Assets/icon.ico
          --channel win
          --outputDir Releases

      - name: Rename portable exe
        shell: pwsh
        run: Copy-Item artifacts/portable/PcChecker.exe "Releases/PcChecker-${{ steps.version.outputs.version }}-portable-win-x64.exe"

      - name: Extract release notes from the changelog
        id: notes
        shell: pwsh
        run: |
          $text = Get-Content CHANGELOG.md -Raw
          $pattern = "(?s)## \[${{ steps.version.outputs.version }}\][^\n]*\n(.*?)(?=\n## \[|\z)"
          $m = [regex]::Match($text, $pattern)
          $body = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "See CHANGELOG.md." }
          Set-Content -Path release-notes.md -Value $body
          Write-Host $body

      - name: Publish to GitHub Releases
        run: >
          vpk upload github
          --repoUrl ${{ env.REPO_URL }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --publish
          --releaseName "PC Checker ${{ steps.version.outputs.version }}"
          --tag ${{ steps.version.outputs.tag }}
          --channel win
          --outputDir Releases
          ${{ steps.version.outputs.prerelease == 'true' && '--pre' || '' }}

      - name: Attach portable exe and release notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: PC Checker ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: Releases/PcChecker-${{ steps.version.outputs.version }}-portable-win-x64.exe
