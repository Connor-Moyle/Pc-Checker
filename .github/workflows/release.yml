name: Release

# Tag a commit as vX.Y.Z (or vX.Y.Z-beta.N for the Beta channel) and push the
# tag (an annotated tag's message becomes the release codename). This workflow
# builds and tests the app and publishes ONE file, a self-contained
# PcChecker.exe, with its SHA-256 in the release notes. The in-app updater
# downloads that same file and verifies the checksum.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (for example 0.2.0 or 0.2.0-beta.1). The tag v<version> is created on this commit if it does not exist."
        required: true
      codename:
        description: "Optional release codename shown in the release title (for example Cold Boot)."
        required: false
        default: ""

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  REPO_URL: https://github.com/${{ github.repository }}

jobs:
  release:
    name: Build, package and publish
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Work out the version
        id: version
        shell: pwsh
        env:
          RELEASE_CODENAME: ${{ inputs.codename }}
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}' }
          $v = $v.TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "'$v' is not a valid semantic version." }
          $pre = $v.Contains('-')
          "version=$v" >> $env:GITHUB_OUTPUT
          "prerelease=$($pre.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
          # Optional codename: the subject line of an annotated tag (git tag -a v1.2.3 -m "Codename").
          git fetch --force --tags origin 2>$null
          $codename = "$env:RELEASE_CODENAME".Trim()
          if (-not $codename -and (git cat-file -t "v$v" 2>$null) -eq 'tag') { $codename = (git tag -l --format='%(contents:subject)' "v$v").Trim() }
          $title = if ($codename) { "PC Checker $v `"$codename`"" } else { "PC Checker $v" }
          "title=$title" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing $title (prerelease: $pre)"

      - name: Restore
        run: dotnet restore PcChecker.sln

      - name: Build
        run: dotnet build PcChecker.sln -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test PcChecker.sln -c Release --no-build

      - name: Publish single-file executables (x64 and ARM64)
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish src/PcChecker.App/PcChecker.App.csproj -c Release -r $rid --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None `
              -p:Version=${{ steps.version.outputs.version }} -o "publish/$rid"
            if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed for $rid" }
          }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item publish/win-x64/PcChecker.exe release/PcChecker.exe
          Copy-Item publish/win-arm64/PcChecker.exe release/PcChecker-arm64.exe

      # Code signing switches on by itself once these repository secrets exist:
      #   SIGNING_CERT_PFX_BASE64  - the code-signing certificate (.pfx) as base64
      #   SIGNING_CERT_PASSWORD    - its password
      - name: Sign the executables (when a certificate is configured)
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_PFX_BASE64) { Write-Host "No signing certificate configured; publishing unsigned."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe was not found on the runner." }
          foreach ($file in Get-ChildItem release -Filter *.exe) {
            & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $env:CERT_PASSWORD $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing $($file.Name) failed." }
          }
          Remove-Item $pfx -Force
          "signed=true" >> $env:GITHUB_OUTPUT

      - name: Write the release notes
        shell: pwsh
        run: |
          $x64 = (Get-FileHash release/PcChecker.exe -Algorithm SHA256).Hash.ToLower()
          $arm = (Get-FileHash release/PcChecker-arm64.exe -Algorithm SHA256).Hash.ToLower()
          $size = [math]::Round((Get-Item release/PcChecker.exe).Length / 1MB, 1)
          $signed = (Get-AuthenticodeSignature release/PcChecker.exe).Status -eq 'Valid'
          $lines = @(
            "## Download and run",
            "",
            "Download **PcChecker.exe** below and double-click it. That is all: there is nothing to install and .NET is built in.",
            "",
            "- Works on Windows 11 and Windows 10 22H2 (64-bit). Size: $size MB.",
            "- Windows on Arm laptops (Snapdragon): download **PcChecker-arm64.exe** instead. Sensors, fan control and GPU tuning are limited on Arm because the hardware drivers they rely on are x64-only.",
            "- Windows asks for administrator permission when it starts; PC Checker needs it to read sensors, SMART data and drivers and to apply the changes you choose."
          )
          if (-not $signed) {
            $lines += "- The first time, SmartScreen may say *Windows protected your PC* because the file is not code-signed yet. Click **More info** then **Run anyway**."
          }
          $lines += @(
            "- PC Checker updates itself from this page (Settings, Updates). Settings and logs live in %LOCALAPPDATA%\PcChecker.",
            "",
            "**SHA-256 (PcChecker.exe):** ``$x64``",
            "",
            "**SHA-256 (PcChecker-arm64.exe):** ``$arm``"
          )
          Set-Content -Path release-notes.md -Value ($lines -join "`n")
          Get-Content release-notes.md

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.title }}
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            release/PcChecker.exe
            release/PcChecker-arm64.exe
