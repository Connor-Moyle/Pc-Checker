name: Screenshots

# Captures every page from demo mode on a Windows runner and commits the PNGs
# into docs/screenshots/. Runs on demand and whenever app code changes on main.

on:
  workflow_dispatch:
    inputs:
      full_pages:
        description: "Also capture every page at full length and push them to a ui-review/<run> branch (docs are not changed)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "src/**"

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  capture:
    name: Capture and commit
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore PcChecker.sln

      - name: Build
        run: dotnet build PcChecker.sln -c Release --no-restore

      - name: Publish self-contained win-x64
        run: >
          dotnet publish src/PcChecker.App/PcChecker.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64

      - name: Run the screenshot runner
        shell: pwsh
        timeout-minutes: 10
        run: |
          $exe = Join-Path $PWD 'publish\win-x64\PcChecker.exe'
          $out = Join-Path $PWD 'screenshots'
          if ('${{ inputs.full_pages }}' -eq 'true') { $env:PCCHECKER_FULL_PAGES = '1' }
          $p = Start-Process -FilePath $exe -ArgumentList @('--screenshots', $out, '--demo') -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "The screenshot runner failed with exit code $($p.ExitCode)." }
          Get-ChildItem $out | Format-Table Name, Length

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: error

      - name: Push full-length pages for review
        if: ${{ inputs.full_pages }}
        shell: pwsh
        run: |
          $branch = "ui-review/${{ github.run_id }}"
          New-Item -ItemType Directory -Force -Path review | Out-Null
          Copy-Item screenshots/full/*.png review/
          Set-Location review
          git init -q -b $branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Full-length page captures for review"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$branch"

      - name: Copy into docs/screenshots
        if: ${{ !inputs.full_pages }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path docs/screenshots | Out-Null
          Get-ChildItem docs/screenshots -Filter *.png | Remove-Item -Force
          Copy-Item screenshots/*.png docs/screenshots/
          Copy-Item screenshots/index.json docs/screenshots/index.json -Force

      - name: Commit when changed
        if: ${{ !inputs.full_pages }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add docs/screenshots
          if (git diff --cached --quiet) {
            Write-Host "Screenshots are unchanged; nothing to commit."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update screenshots [skip ci]"
          git push
