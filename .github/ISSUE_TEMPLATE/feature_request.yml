name: Feature request
description: Suggest something new or an improvement to an existing feature.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution. "I can't tell which startup app is slowing my boot" rather than "add a column".
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Other apps or workarounds, and why they are not enough.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dashboard and reports
        - Temperatures, power and overlay
        - Hardware inventory and health
        - Storage (tests, benchmarks, repairs)
        - Memory (tests, profiles, page file)
        - Displays
        - Audio
        - Keyboard and mouse
        - Fans
        - Lighting (RGB)
        - Drivers
        - Software and cleanup
        - Startup and Windows features
        - Performance, optimization and latency
        - Overclocking
        - Claude assistant
        - Logging and settings
        - Updates and installation
        - Other
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: This feature changes the system (deletes, installs, edits settings, controls hardware) and I understand it will need a confirmation dialog, a restore point and a journal entry.
