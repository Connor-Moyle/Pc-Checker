name: Bug report
description: Something is broken or behaves unexpectedly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The more detail you give, the faster it gets fixed.
        For a sensor, fan, GPU, RGB or monitor that is not detected, please use the **Driver or hardware issue** form instead.
  - type: input
    id: version
    attributes:
      label: PC Checker version
      description: Settings → About, or the version shown in the title bar.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Run `winver` and copy the version and build.
      placeholder: "Windows 11 24H2 (build 26100.1234)"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Where did you get it?
      options:
        - PcChecker.exe from the Releases page
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: page
    attributes:
      label: Which page?
      options:
        - Dashboard
        - Temperatures
        - Power
        - Overlay
        - Hardware
        - Health
        - Storage
        - Memory
        - Displays
        - Audio
        - Keyboard & Mouse
        - Fans
        - Lighting
        - Drivers
        - Software
        - Startup
        - Windows Features
        - Cleanup
        - Performance
        - Optimize
        - Latency
        - Overclock
        - Ask Claude
        - Logs
        - Settings
        - App start / installation / updates
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Cleanup page
        2. Click Scan
        3. ...
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics export
      description: Logs page → **Export diagnostics**, then drag the zip here. Serial numbers are masked when *Hide serial numbers and MAC addresses in logs* is on (Logs page → **Logging settings** tab).
  - type: textarea
    id: hardware
    attributes:
      label: Hardware (optional)
      description: CPU, GPU, motherboard, laptop model. Helpful for sensor, driver, fan and overclock issues.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I am on the latest release (the app can update itself from Settings → Updates).
